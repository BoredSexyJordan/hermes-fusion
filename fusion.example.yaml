# Fusion router — example config.
# Copy to HERMES_HOME/fusion.yaml (e.g. ~/.hermes/fusion.yaml) to override.
#
# Team rosters are AUTO-DETECTED from the models your harnesses actually have
# installed (see `hermes fusion teams`). You only need this file to force a
# specific roster or pin exact models. The structure is always:
#   Frontier (consult/synthesis) -> Middle Manager -> Frontier (workers)
#
# Example: force a technical roster across specific installed models.
# team_templates:
#   technical:
#     task_type: technical
#     middle_manager: {model: deepseek-chat, provider: deepseek}
#     members:
#       - {role: worker-1, model: claude-opus-4-8, provider: anthropic,
#          delegation: delegate_task, thread_policy: continuous}
#       - {role: worker-2, model: gpt-5.6, provider: openai,
#          delegation: delegate_task, thread_policy: continuous}
#     consults:
#       - {role: consult, model: gpt-5.6, provider: openai,
#          delegation: clean_session, trigger: final synthesis / decision}
